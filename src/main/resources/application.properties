# 로컬 실행: docker compose up -d 로 띄운 PostgreSQL
# 인수 테스트는 CucumberSpringConfiguration이 접속 정보(url·username·password)를 Testcontainers 값으로 덮어쓴다.
spring.datasource.url=jdbc:postgresql://localhost:5432/nextstep_shop
spring.datasource.username=nextstep
spring.datasource.password=nextstep
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

spring.liquibase.change-log=classpath:db/changelog.xml
logging.level.liquibase=INFO
